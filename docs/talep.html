<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teklif isteyin</title><meta name="description" content="Excel ve veri hizmetleri için teklif formu"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem 16px;color:#1b1b1b;background:#fff}h1,h2{line-height:1.25}a{color:#0b5cad}nav a{margin-right:1rem}.btn{display:inline-block;background:#0b5cad;color:#fff;padding:.6rem 1rem;border-radius:6px;border:0;font-size:1rem;text-decoration:none}input,textarea,select{font:inherit;padding:.4rem;max-width:100%;box-sizing:border-box}img{max-width:100%}.k{background:#f3f6fa;border-left:4px solid #0b5cad;padding:.6rem 1rem;margin:1rem 0}code{background:#eef;padding:0 .25rem}@media(prefers-color-scheme:dark){body{background:#111;color:#e8e8e8}.btn{display:inline-block;background:#0b5cad;color:#fff;padding:.6rem 1rem;border-radius:6px;border:0;font-size:1rem;text-decoration:none}input,textarea,select{font:inherit;padding:.4rem;max-width:100%;box-sizing:border-box}img{max-width:100%}.k{background:#1b222b}a{color:#7ab7ff}code{background:#223}}</style></head><body><nav><a href="index.html">Ana sayfa</a><a href="hizmetler/">Hizmetler</a></nav><h1>Teklif isteyin</h1><p>Ne yapılmasını istediğinizi kısaca yazın; dosyanızı göndermeyin, kişisel/gizli veri paylaşmayın.</p><form onsubmit="return false"><p><label>Hizmet<br><select name="hizmet" id="hz"><option value="excel-otomasyonu">Excel otomasyonu</option><option value="pdf-raporlama">PDF raporlama</option><option value="veri-temizleme">Veri temizleme</option><option value="isletme-takip">İşletme takip yazılımı</option></select></label></p><p><label>Ne yapılacak?<br><textarea name="aciklama" rows="5" style="width:100%" required></textarea></label></p><p><label>Yaklaşık dosya sayısı / satır sayısı<br><input name="olcek" style="width:100%"></label></p><p><label>Size nasıl dönelim? (e-posta veya telefon)<br><input name="iletisim" style="width:100%" required></label></p><p><button class="btn" type="submit">Gönder</button></p></form><p><small>İletişim adresi henüz tanımlanmadı; form şu an gönderim yapmıyor. Geçici olarak GitHub hesabı olanlar Issues kullanabilir.</small></p><script>var q=new URLSearchParams(location.search).get("hizmet");if(q){document.getElementById("hz").value=q}</script></body></html>
